// ライフイベントデータ
let simEvents=[];
let simEventId=0;

function addEvent(data){
  simEvents.push(Object.assign({id:simEventId++,isIncome:false},data));
}

function renderEvents(){
  const list=document.getElementById('sim-ev-list');if(!list)return;
  list.innerHTML='';
  if(!simEvents.length){
    const empty=document.createElement('div');empty.style.cssText='font-size:12px;color:#aaa;padding:8px 0';empty.textContent='イベントなし（上のボタンで追加）';list.appendChild(empty);return;
  }

  function mkNumInp(val,label,onchange,width){
    const wrap=document.createElement('label');wrap.style.cssText='display:flex;align-items:center;gap:3px;font-size:11px;color:#666';
    wrap.textContent=label;
    const inp=document.createElement('input');inp.type='number';inp.value=val;inp.style.cssText='width:'+(width||44)+'px;padding:3px 5px;border:1px solid #ddd;border-radius:5px;font-size:12px';
    inp.addEventListener('input',function(){onchange(parseFloat(inp.value)||0);runSim();});
    wrap.appendChild(inp);return wrap;
  }

  // グループ単位でまとめる
  const groups={};
  simEvents.forEach(function(ev){
    const g=ev.group||'その他';
    if(!groups[g])groups[g]=[];
    groups[g].push(ev);
  });

  Object.keys(groups).forEach(function(groupName){
    const groupEvs=groups[groupName];
    const groupEnabled=groupEvs.some(e=>e.enabled!==false);

    // グループヘッダー
    const ghdr=document.createElement('div');
    ghdr.style.cssText='background:#eff6ff;border:1.5px solid #bfdbfe;border-radius:10px;margin-bottom:4px;overflow:hidden';

    const ghdrTop=document.createElement('div');
    ghdrTop.style.cssText='display:flex;align-items:center;gap:8px;padding:8px 12px;cursor:pointer';

    const gToggleAll=document.createElement('input');gToggleAll.type='checkbox';gToggleAll.checked=groupEnabled;gToggleAll.style.cssText='width:16px;height:16px;cursor:pointer';
    gToggleAll.title='グループ全体をON/OFF';
    gToggleAll.addEventListener('change',function(){
      groupEvs.forEach(function(ev){ev.enabled=gToggleAll.checked;});
      renderEvents();runSim();
    });

    const gName=document.createElement('span');gName.style.cssText='font-size:13px;font-weight:700;color:#1e40af;flex:1';gName.textContent=groupName;
    // パターン名（グループ内の最初のイベントから取得）
    const patName=groupEvs[0]&&groupEvs[0].patternName?groupEvs[0].patternName:null;
    if(patName){const patBadge=document.createElement('span');patBadge.style.cssText='font-size:10px;background:#e0e7ff;color:#3730a3;border-radius:4px;padding:2px 6px;margin-left:4px';patBadge.textContent=patName;gName.appendChild(patBadge);}
    const gCount=document.createElement('span');gCount.style.cssText='font-size:11px;color:#888';gCount.textContent=groupEvs.length+'項目';

    const expandBtn=document.createElement('span');expandBtn.style.cssText='font-size:12px;color:#888;transform:rotate(0deg);transition:transform .2s';expandBtn.textContent='▼';

    ghdrTop.appendChild(gToggleAll);ghdrTop.appendChild(gName);ghdrTop.appendChild(gCount);ghdrTop.appendChild(expandBtn);
    ghdr.appendChild(ghdrTop);

    // グループ内の項目リスト
    const gBody=document.createElement('div');gBody.style.cssText='padding:0 12px 8px';

    groupEvs.forEach(function(ev){
      const isInc=ev.isIncome===true;
      const row=document.createElement('div');
      row.style.cssText='background:#fff;border-radius:8px;padding:8px 10px;border:1.5px solid '+(isInc?'#bae6fd':'#e0e7ff')+';margin-bottom:6px;'+(ev.enabled===false?'opacity:0.45':'');

      const r1=document.createElement('div');r1.style.cssText='display:flex;gap:6px;align-items:center;margin-bottom:5px';

      const evCb=document.createElement('input');evCb.type='checkbox';evCb.checked=ev.enabled!==false;evCb.style.cssText='width:14px;height:14px;cursor:pointer';
      evCb.addEventListener('change',function(){
        ev.enabled=evCb.checked;
        row.style.opacity=evCb.checked?'1':'0.45';
        // グループチェックボックスも更新
        gToggleAll.checked=groupEvs.some(e=>e.enabled!==false);
        runSim();
      });

      const typeBadge=document.createElement('span');
      typeBadge.style.cssText='font-size:10px;padding:2px 7px;border-radius:4px;font-weight:600;flex-shrink:0;'+(ev.isIncome?'background:#dbeafe;color:#0369a1':'background:#fee2e2;color:#991b1b');
      typeBadge.textContent=ev.isIncome?'収入':'支出';
      const nameInp=document.createElement('input');nameInp.type='text';nameInp.value=ev.label;nameInp.className='sim-input';nameInp.style.cssText='flex:1;font-size:12px;padding:4px 6px';
      nameInp.addEventListener('input',function(){ev.label=nameInp.value;});

      const delBtn=document.createElement('button');delBtn.textContent='✕';delBtn.style.cssText='padding:3px 7px;border:none;background:#fee2e2;color:#991b1b;border-radius:5px;cursor:pointer;font-size:11px';
      delBtn.addEventListener('click',function(){simEvents=simEvents.filter(e=>e.id!==ev.id);renderEvents();runSim();});

      r1.appendChild(evCb);r1.appendChild(typeBadge);r1.appendChild(nameInp);r1.appendChild(delBtn);row.appendChild(r1);

      const r2=document.createElement('div');r2.style.cssText='display:flex;gap:6px;align-items:center;flex-wrap:wrap';
      r2.appendChild(mkNumInp(ev.startAge,'開始年齢',function(v){ev.startAge=v;}));
      r2.appendChild(mkNumInp(ev.endAge,'終了年齢',function(v){ev.endAge=v;}));
      r2.appendChild(mkNumInp(ev.monthly,'月額(万円)',function(v){ev.monthly=v;},48));
      r2.appendChild(mkNumInp(ev.oneTime,'一時金(万円)',function(v){ev.oneTime=v;},52));
      r2.appendChild(mkNumInp(ev.interval,'頻度(年,0=一回)',function(v){ev.interval=v;},56));
      row.appendChild(r2);
      gBody.appendChild(row);
    });

    // グループ内カスタム追加ボタン
    const gAddBtn=document.createElement('button');
    gAddBtn.textContent='＋ '+groupName+'に追加';
    gAddBtn.style.cssText='margin-top:4px;padding:4px 10px;font-size:11px;background:#e0e7ff;color:#3730a3;border:none;border-radius:6px;cursor:pointer;width:100%';
    gAddBtn.addEventListener('click',function(){
      addEvent({label:'新しい項目',group:groupName,startAge:getSimVal('sim-age')||35,endAge:95,monthly:0,oneTime:0,interval:0});
      renderEvents();runSim();
    });
    gBody.appendChild(gAddBtn);

    // グループ削除ボタン
    const gDelBtn=document.createElement('button');
    gDelBtn.textContent='🗑 '+groupName+'を削除';
    gDelBtn.style.cssText='margin-top:4px;padding:4px 10px;font-size:11px;background:#fee2e2;color:#991b1b;border:none;border-radius:6px;cursor:pointer;width:100%';
    gDelBtn.addEventListener('click',function(){
      if(!confirm(groupName+'のイベントをすべて削除しますか？')) return;
      simEvents=simEvents.filter(e=>(e.group||'その他')!==groupName);
      renderEvents();runSim();
    });
    gBody.appendChild(gDelBtn);

    // 展開/折りたたみ
    let expanded=true;
    ghdrTop.addEventListener('click',function(e){
      if(e.target===gToggleAll) return;
      expanded=!expanded;
      gBody.style.display=expanded?'block':'none';
      expandBtn.style.transform=expanded?'rotate(0deg)':'rotate(-90deg)';
    });

    ghdr.appendChild(gBody);
    list.appendChild(ghdr);
  });
}

function getSimVal(id){return parseFloat(document.getElementById(id).value)||0;}

function runSim(){
  const age=Math.round(getSimVal('sim-age'));
  const retireAge=Math.round(getSimVal('sim-retire'));
  const cash=getSimVal('sim-cash')*10000;
  const invest=getSimVal('sim-invest')*10000;
  const monthly=getSimVal('sim-monthly')*10000;
  const rate=getSimVal('sim-rate')/100;
  const stopAge=Math.round(getSimVal('sim-stop-age'));
  const drawdownAge=Math.round(getSimVal('sim-drawdown-age'));
  const drawdownRate=getSimVal('sim-drawdown-rate')/100;
  const cashGainMonthly=getSimVal('sim-cash-gain')*10000;
  if(age<=0||retireAge<=age) return;
  const result=document.getElementById('sim-result');if(!result)return;
  // 表示間隔の値を再描画前に保存
  const _savedStep=(document.getElementById('sim-table-step')||{value:'5'}).value||'5';
  result.innerHTML='';
  const maxAge=Math.max(retireAge,drawdownAge)+30;
  const years=[];
  let principal=invest,value=invest,totalContrib=invest;
  let cashBalance=cash;
  let cashBalanceNoEvent=cash;
  for(let a=age;a<=maxAge;a++){
    const isDrawdown=a>=drawdownAge;
    let yearlyContrib=0,drawAmt=0;
    if(!isDrawdown){
      const monthlyRate=Math.pow(1+rate,1/12)-1;
      const contrib=a<stopAge?monthly:0;
      let v=value;
      for(let m=0;m<12;m++){v=(v+contrib)*(1+monthlyRate);yearlyContrib+=contrib;}
      value=v;totalContrib+=yearlyContrib;principal+=yearlyContrib;
    } else {
      drawAmt=value*drawdownRate;value=(value-drawAmt)*(1+rate);if(value<0)value=0;
    }
    // 現金残高計算: 月間増加額から積立分を引いた分が現金に積み上がる
    // sim-cash-gainは既に積立を引いた後の純現金増加額
    const monthlyCashGain=isDrawdown?0:cashGainMonthly;
    cashBalance+=monthlyCashGain*12;
    cashBalanceNoEvent+=monthlyCashGain*12;
    // ライフイベントによる支出
    let eventCost=0;
    // イベント別コストを記録
    const eventCostByEvId={};
    simEvents.forEach(function(ev){
      if(ev.enabled===false) return;
      if(a<ev.startAge||a>ev.endAge) return;
      let cost=0;
      if(ev.monthly>0) cost+=ev.monthly*10000*12;
      if(ev.oneTime>0){
        if(ev.interval<=0){
          if(a===Math.round(ev.startAge)) cost+=ev.oneTime*10000;
        } else {
          if((a-Math.round(ev.startAge))%Math.round(ev.interval)===0) cost+=ev.oneTime*10000;
        }
      }
      if(cost>0){eventCostByEvId[ev.id]=cost;eventCost+=cost;}
    });
    cashBalance-=eventCost;
    years.push({age:a,value:Math.round(value),principal:Math.round(principal),gain:Math.round(value-principal),drawAmt:Math.round(drawAmt),drawMonthly:Math.round(drawAmt/12),isRetire:a===retireAge,isDrawdown:isDrawdown&&a>=drawdownAge,cash:Math.round(cashBalance),cashNoEvent:Math.round(cashBalanceNoEvent),total:Math.round(value+cashBalance),eventCost:Math.round(eventCost),eventCostByEvId:Object.assign({},eventCostByEvId)});
  }
  const retireRow=years.find(y=>y.age===retireAge)||years[years.length-1];
  const drawdownRow=years.find(y=>y.age===drawdownAge);
  const cardTitle=document.createElement('div');cardTitle.className='sim-section-title';cardTitle.textContent='📈 シミュレーション結果';result.appendChild(cardTitle);
  const cards=document.createElement('div');cards.className='sim-result-cards';
  [{label:`${retireAge}歳時点の総資産`,val:fmtMan(retireRow.total||retireRow.value),sub:`投資 ${fmtMan(retireRow.value)} + 現金 ${fmtMan(retireRow.cash||0)}`,color:'#166534'},
   {label:`${retireAge}歳時点の現金`,val:fmtMan(retireRow.cash||0),sub:`月${fmtMan(cashGainMonthly)}×${retireAge-age}年積み上げ`,color:'#0369a1'},
   {label:`切り崩し年額 (${drawdownAge}歳～)`,val:drawdownRow?fmtMan(drawdownRow.drawAmt):'—',sub:drawdownRow?`月額 ${fmtMan(drawdownRow.drawMonthly)}`:'',color:'#d97706'}
  ].forEach(function(c){
    const card=document.createElement('div');card.className='sim-card';
    const lbl=document.createElement('div');lbl.className='sim-card-label';lbl.textContent=c.label;
    const val=document.createElement('div');val.className='sim-card-val';val.style.color=c.color;val.textContent=c.val;
    const sub=document.createElement('div');sub.className='sim-card-sub';sub.textContent=c.sub;
    card.appendChild(lbl);card.appendChild(val);card.appendChild(sub);cards.appendChild(card);
  });
  result.appendChild(cards);
  const chartTitle=document.createElement('div');chartTitle.className='sim-section-title';chartTitle.textContent='📊 資産推移グラフ';result.appendChild(chartTitle);
  const chartWrap=document.createElement('div');chartWrap.className='sim-chart-wrap';
  const svgNS='http://www.w3.org/2000/svg';
  const W=800,H=280,pL=80,pR=20,pT=20,pB=40,cW=W-pL-pR,cH=H-pT-pB;
  const maxVal=Math.max(...years.map(y=>y.total||y.value),1);
  const n=years.length,bW=Math.max(4,Math.min(20,cW/n*0.65)),gap=cW/n;
  const svg=document.createElementNS(svgNS,'svg');
  svg.setAttribute('viewBox','0 0 '+W+' '+H);svg.setAttribute('width',W);svg.setAttribute('height',H);
  svg.style.cssText='display:block;min-width:'+W+'px';svg.style.pointerEvents='none';
  [0,0.25,0.5,0.75,1].forEach(function(f){
    const y=pT+cH*(1-f);
    const line=document.createElementNS(svgNS,'line');line.setAttribute('x1',pL);line.setAttribute('y1',y);line.setAttribute('x2',W-pR);line.setAttribute('y2',y);line.setAttribute('stroke','#eee');line.setAttribute('stroke-width','1');svg.appendChild(line);
    const t=document.createElementNS(svgNS,'text');t.setAttribute('x',pL-6);t.setAttribute('y',y+4);t.setAttribute('text-anchor','end');t.setAttribute('font-size','10');t.setAttribute('fill','#aaa');t.textContent=fmtM(maxVal*f);svg.appendChild(t);
  });
  years.forEach(function(y,i){
    const x=pL+gap*i+gap/2;
    const totalH=Math.max((y.value/maxVal)*cH,0);
    const prinH=Math.max((Math.min(y.principal,y.value)/maxVal)*cH,0);
    const gainH=totalH-prinH;
    if(prinH>0){const r=document.createElementNS(svgNS,'rect');r.setAttribute('x',x-bW/2);r.setAttribute('y',pT+cH-prinH);r.setAttribute('width',bW);r.setAttribute('height',prinH);r.setAttribute('fill',y.isDrawdown?'#93c5fd':'#3b82f6');r.setAttribute('rx','1');svg.appendChild(r);}
    if(gainH>0){const r=document.createElementNS(svgNS,'rect');r.setAttribute('x',x-bW/2);r.setAttribute('y',pT+cH-totalH);r.setAttribute('width',bW);r.setAttribute('height',gainH);r.setAttribute('fill',y.isDrawdown?'#6ee7b7':'#10b981');r.setAttribute('rx','1');svg.appendChild(r);}
    // 現金バー（右隣に表示）
    if(y.cash>0&&!y.isDrawdown){
      const cashH=Math.max((y.cash/maxVal)*cH,0);
      const rc=document.createElementNS(svgNS,'rect');
      rc.setAttribute('x',x+bW/2+1);rc.setAttribute('y',pT+cH-cashH);
      rc.setAttribute('width',bW*0.8);rc.setAttribute('height',cashH);
      rc.setAttribute('fill','#f59e0b');rc.setAttribute('rx','1');svg.appendChild(rc);
    }
    // イベントなし現金（薄い比較バー）
    if(simEvents.length>0&&y.cashNoEvent>0&&!y.isDrawdown){
      const noEvH=Math.max((y.cashNoEvent/maxVal)*cH,0);
      const rn=document.createElementNS(svgNS,'rect');
      rn.setAttribute('x',x+bW/2+1);rn.setAttribute('y',pT+cH-noEvH);
      rn.setAttribute('width',bW*0.8);rn.setAttribute('height',noEvH);
      rn.setAttribute('fill','none');rn.setAttribute('stroke','#f59e0b');rn.setAttribute('stroke-width','1');rn.setAttribute('stroke-dasharray','3,2');rn.setAttribute('rx','1');svg.appendChild(rn);
    }
    if(y.isRetire||y.age===drawdownAge){const line=document.createElementNS(svgNS,'line');line.setAttribute('x1',x);line.setAttribute('y1',pT);line.setAttribute('x2',x);line.setAttribute('y2',pT+cH);line.setAttribute('stroke',y.isRetire?'#2563eb':'#d97706');line.setAttribute('stroke-width','1.5');line.setAttribute('stroke-dasharray','4,3');svg.appendChild(line);}
    if(y.age%5===0){const t=document.createElementNS(svgNS,'text');t.setAttribute('x',x);t.setAttribute('y',pT+cH+16);t.setAttribute('text-anchor','middle');t.setAttribute('font-size','10');t.setAttribute('fill','#888');t.textContent=y.age;svg.appendChild(t);}
  });
  chartWrap.appendChild(svg);result.appendChild(chartWrap);
  const leg=document.createElement('div');leg.className='legend';leg.style.marginBottom='16px';
  const legendItems=[{c:'#3b82f6',l:'元本（積立）'},{c:'#10b981',l:'運用益'},{c:'#f59e0b',l:'現金'}];
  if(simEvents.length>0) legendItems.push({c:'#f59e0b',l:'現金（イベントなし）',dashed:true});
  legendItems.push({c:'#93c5fd',l:'元本（切崩後）'},{c:'#6ee7b7',l:'運用益（切崩後）'});
  legendItems.forEach(function(item){
    const sp=document.createElement('span');sp.className='leg-item';const sw=document.createElement('span');sw.className='leg-swatch';sw.style.background=item.c;sp.appendChild(sw);sp.appendChild(document.createTextNode(item.l));leg.appendChild(sp);
  });
  result.appendChild(leg);
  const tblTitleRow=document.createElement('div');tblTitleRow.style.cssText='display:flex;align-items:center;justify-content:space-between;margin-bottom:0';
  const tblTitle=document.createElement('div');tblTitle.className='sim-section-title';tblTitle.textContent='📋 年齢別詳細';tblTitle.style.marginBottom='0';
  const stepWrap=document.createElement('label');stepWrap.style.cssText='font-size:12px;color:#666;display:flex;align-items:center;gap:6px';
  stepWrap.textContent='表示間隔: ';
  const stepSel=document.createElement('select');stepSel.id='sim-table-step';stepSel.className='trend-sel';
  [['1','1年ごと'],['2','2年ごと'],['5','5年ごと（デフォルト）'],['10','10年ごと']].forEach(function(o){
    const opt=document.createElement('option');opt.value=o[0];opt.textContent=o[1];if(o[0]===_savedStep)opt.selected=true;stepSel.appendChild(opt);
  });
  stepSel.addEventListener('change',runSim);
  stepWrap.appendChild(stepSel);
  tblTitleRow.appendChild(tblTitle);tblTitleRow.appendChild(stepWrap);
  result.appendChild(tblTitleRow);
  const tblWrap=document.createElement('div');tblWrap.className='sim-table-wrap';
  const tbl=document.createElement('table');tbl.className='sim-table';
  const thead=document.createElement('thead');const htr=document.createElement('tr');
  const activeEvents=simEvents.filter(e=>e.enabled!==false);

  // patternNameから年齢情報を抽出してサブ年齢マップを作成
  // 例: "公立コース (32歳で出産)" → {type:'child', birthAge:32}
  // 例: "月2〜3万円の仕送り (親 現在65歳)" → {type:'parent', currentAge:65}
  // 例: "犬（小型） (ペット 現在3歳...)" → {type:'pet', currentAge:3}
  const contextAges=[];
  const seenGroups=new Set();
  activeEvents.forEach(function(ev){
    if(!ev.patternName||seenGroups.has(ev.group)) return;
    seenGroups.add(ev.group);
    const pm=ev.patternName;
    // patternNameから年齢を抽出（形式例: "公立コース (32歳で出産)", "月2〜3万円 (親 現在65歳)"）
    if(pm.indexOf('歳で出産')>=0){
      const n=parseInt(pm.replace(/.*\((\d+)歳で出産\).*/,'$1'));
      // グループ名から子番号を取得（例: "👶 子供2" → "子2"）
      const childNumMatch=ev.group.match(/子供(\d+)/);
      const childLabel=childNumMatch?'子'+childNumMatch[1]:'子';
      if(!isNaN(n)) contextAges.push({label:childLabel,type:'child',birthAge:n,group:ev.group});
    } else if(pm.indexOf('親 現在')>=0){
      const n=parseInt(pm.replace(/.*親 現在(\d+)歳.*/,'$1'));
      if(!isNaN(n)) contextAges.push({label:'親',type:'parent',currentAge:n,startAge:age,group:ev.group});
    } else if(pm.indexOf('ペット 現在')>=0){
      const n=parseInt(pm.replace(/.*ペット 現在(\d+)歳.*/,'$1'));
      if(!isNaN(n)) contextAges.push({label:'ペット',type:'pet',currentAge:n,startAge:age,group:ev.group});
    }
  });

  // テーブル上のイベントチェックボックスUI
  const tblCbWrap=document.createElement('div');
  tblCbWrap.style.cssText='display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;padding:8px 10px;background:#fff8f8;border:1px solid #fecaca;border-radius:8px';
  if(simEvents.length>0){
    const tblCbTitle=document.createElement('div');tblCbTitle.style.cssText='width:100%;font-size:11px;font-weight:600;color:#991b1b;margin-bottom:4px';
    tblCbTitle.textContent='📋 表示・有効化するイベント（チェックでON/OFF）';tblCbWrap.appendChild(tblCbTitle);
    // グループ単位で表示
    const groups={};
    simEvents.forEach(function(ev){const g=ev.group||'その他';if(!groups[g])groups[g]=[];groups[g].push(ev);});
    Object.keys(groups).forEach(function(gName){
      const gEvs=groups[gName];
      const gWrap=document.createElement('div');gWrap.style.cssText='background:#fff;border:1.5px solid #e0e7ff;border-radius:6px;padding:6px 8px;min-width:140px';
      // グループチェック
      const gRow=document.createElement('div');gRow.style.cssText='display:flex;align-items:center;gap:4px;margin-bottom:4px';
      const gCb=document.createElement('input');gCb.type='checkbox';gCb.style.cssText='width:14px;height:14px;cursor:pointer';
      gCb.checked=gEvs.some(e=>e.enabled!==false);
      const gLbl=document.createElement('span');gLbl.style.cssText='font-size:12px;font-weight:700;color:#1e40af';gLbl.textContent=gName;
      gRow.appendChild(gCb);gRow.appendChild(gLbl);gWrap.appendChild(gRow);
      // 個別チェック
      gEvs.forEach(function(ev){
        const eRow=document.createElement('div');eRow.style.cssText='display:flex;align-items:center;gap:4px;padding-left:8px';
        const eCb=document.createElement('input');eCb.type='checkbox';eCb.style.cssText='width:12px;height:12px;cursor:pointer';
        eCb.checked=ev.enabled!==false;
        eCb.addEventListener('change',function(){
          ev.enabled=eCb.checked;
          gCb.checked=gEvs.some(e=>e.enabled!==false);
          renderEvents();runSim();
        });
        const eLbl=document.createElement('span');eLbl.style.cssText='font-size:11px;color:'+(ev.isIncome?'#0369a1':'#555');eLbl.textContent=(ev.isIncome?'💰 ':'💸 ')+ev.label;
        eRow.appendChild(eCb);eRow.appendChild(eLbl);gWrap.appendChild(eRow);
      });
      gCb.addEventListener('change',function(){
        gEvs.forEach(function(ev){ev.enabled=gCb.checked;});
        gWrap.querySelectorAll('input[type=checkbox]').forEach(function(cb,i){if(i>0)cb.checked=gCb.checked;});
        renderEvents();runSim();
      });
      tblCbWrap.appendChild(gWrap);
    });
    tblWrap.appendChild(tblCbWrap);
  }

  // 列順: 年齢・投資信託・元本・運用益・各イベント・現金(比較)・現金・総資産・切崩
  const baseCols=activeEvents.length>0?['年齢','投資','元本','運用益','現金(比較)']:['年齢','投資','元本','運用益'];
  const afterCols=['現金','総資産','切崩年額','切崩月額'];
  const activeGroups={};
  activeEvents.forEach(function(ev){const g=ev.group||'その他';if(!activeGroups[g])activeGroups[g]=[];activeGroups[g].push(ev);});

  // 2段ヘッダー用にtheadを作り直す
  const thead2=document.createElement('thead');

  // 上段: ベース列 + グループ名 + 後続列
  const htr1=document.createElement('tr');htr1.className='modal-thead-row';
  baseCols.forEach(function(h){const th=document.createElement('th');th.textContent=h;th.style.cssText='padding:4px 5px;text-align:right;font-weight:600;font-size:10px;color:#888';if(h==='年齢')th.style.textAlign='left';th.rowSpan=2;htr1.appendChild(th);});
  Object.keys(activeGroups).forEach(function(gName){
    const evs=activeGroups[gName];
    const th=document.createElement('th');th.colSpan=evs.length;
    th.style.cssText='padding:4px 5px;text-align:center;font-weight:700;font-size:11px;color:#991b1b;background:#fff8f8;white-space:nowrap;border-left:2px solid #fca5a5;border-right:2px solid #fca5a5;border-top:2px solid #fca5a5;border-radius:4px 4px 0 0';
    const tblPatName=activeGroups[gName][0]&&activeGroups[gName][0].patternName?activeGroups[gName][0].patternName:null;
    th.textContent=gName+(tblPatName?' ['+tblPatName+']':'');htr1.appendChild(th);
  });
  afterCols.forEach(function(h){const th=document.createElement('th');th.textContent=h;th.style.cssText='padding:4px 5px;text-align:right;font-weight:600;font-size:10px;color:#888';th.rowSpan=2;htr1.appendChild(th);});
  thead2.appendChild(htr1);

  // 下段: 各イベント名
  const htr2=document.createElement('tr');htr2.className='modal-thead-row';
  Object.keys(activeGroups).forEach(function(gName){
    activeGroups[gName].forEach(function(ev){
      const th=document.createElement('th');
      th.textContent=ev.label;th.style.cssText='padding:3px 5px;text-align:right;font-weight:600;font-size:10px;color:#991b1b;white-space:nowrap;background:#fff8f8';
      htr2.appendChild(th);
    });
  });
  thead2.appendChild(htr2);

  tbl.innerHTML='';
  tbl.appendChild(thead2);
  thead.appendChild(htr);tbl.appendChild(thead);
  const tbody=document.createElement('tbody');
  const tableStep=parseInt(_savedStep)||5;
  const showAges=new Set();
  years.forEach(function(y){if(y.age%tableStep===0||y.age===retireAge||y.age===drawdownAge)showAges.add(y.age);});
  years.filter(y=>showAges.has(y.age)).forEach(function(y){
    const tr=document.createElement('tr');
    if(y.isRetire&&y.age===drawdownAge)tr.className='sim-highlight sim-drawdown';
    else if(y.isRetire)tr.className='sim-highlight';
    else if(y.isDrawdown)tr.className='sim-drawdown';
    const ageTd=document.createElement('td');
    const agePrimary=document.createElement('div');agePrimary.style.cssText='font-weight:600';agePrimary.textContent=y.age+'歳';
    if(y.isRetire){const b=document.createElement('span');b.className='sim-badge-retire';b.textContent='退職';agePrimary.appendChild(b);}
    if(y.age===drawdownAge&&!y.isRetire){const b=document.createElement('span');b.className='sim-badge-draw';b.textContent='切崩';agePrimary.appendChild(b);}
    ageTd.appendChild(agePrimary);
    // 列順: 年齢・投資信託・元本・運用益・各イベント・現金(比較)・現金・総資産・切崩
    const rowCells=[ageTd,mkTd(fmtMan(y.value),'#1d4ed8'),mkTd(fmtMan(y.principal),'#555'),mkTd(fmtMan(y.gain),'#166534')];
    if(activeEvents.length>0) rowCells.push(mkTd(fmtMan(y.cashNoEvent||0),'#aaa'));
    Object.keys(activeGroups).forEach(function(gName){
      // このグループのcontextAge情報を探す
      const ctx=contextAges.find(function(c){return c.group===gName;});
      activeGroups[gName].forEach(function(ev,ei){
        const rawVal=y.eventCostByEvId&&y.eventCostByEvId[ev.id]?y.eventCostByEvId[ev.id]:0;
        const c=Math.abs(rawVal);
        const isEvInc=ev.isIncome===true;
        const td=document.createElement('td');
        td.style.cssText='padding:5px 6px;text-align:right;white-space:nowrap;color:'+(isEvInc?'#166534':'#991b1b');
        if(ei===0) td.style.borderLeft='2px solid #fecaca';
        if(ei===activeGroups[gName].length-1) td.style.borderRight='2px solid #fecaca';
        // 先頭列にサブ年齢を表示
        if(ei===0&&ctx){
          let subAge=null;
          if(ctx.type==='child'){subAge=y.age-ctx.birthAge;if(subAge<0||subAge>30)subAge=null;}
          else if(ctx.type==='parent'){subAge=ctx.currentAge+(y.age-age);if(subAge>105)subAge=null;}
          else if(ctx.type==='pet'){subAge=ctx.currentAge+(y.age-age);if(subAge<0||subAge>18)subAge=null;}
          if(subAge!==null){
            const ageSub=document.createElement('div');
            ageSub.style.cssText='font-size:9px;color:#6366f1;font-weight:600;text-align:left;margin-bottom:1px';
            ageSub.textContent=ctx.label+' '+Math.round(subAge)+'歳';
            td.appendChild(ageSub);
          }
        }
        const valDiv=document.createElement('div');valDiv.textContent=c>0?(isEvInc?'+':'-')+fmtMan(c):'—';
        td.appendChild(valDiv);
        rowCells.push(td);
      });
    });
    const cashTd=mkTd(fmtMan(y.cash||0),y.cash<0?'#991b1b':'#d97706');
    if(y.cash<0) cashTd.style.fontWeight='700';
    rowCells.push(cashTd);
    rowCells.push(mkTd(fmtMan(y.total||y.value),'#1a1a1a'));
    rowCells.push(mkTd(y.isDrawdown?fmtMan(y.drawAmt):'—','#d97706'));
    rowCells.push(mkTd(y.isDrawdown?fmtMan(y.drawMonthly):'—','#d97706'));
    rowCells.forEach(function(td){tr.appendChild(td);});
    tbody.appendChild(tr);
  });
  tbl.appendChild(tbody);tblWrap.appendChild(tbl);result.appendChild(tblWrap);
}

// ===== イベントリスナー =====
document.getElementById('google-login-btn').addEventListener('click',googleLogin);
document.getElementById('refresh-btn').addEventListener('click',loadFromDrive);
document.getElementById('tab-category').addEventListener('click',function(){switchTab('category');});
document.getElementById('tab-trend').addEventListener('click',function(){switchTab('trend');});
document.getElementById('tab-list').addEventListener('click',function(){switchTab('list');});
document.getElementById('tab-sim').addEventListener('click',function(){switchTab('sim');});
document.getElementById('month-select').addEventListener('change',function(e){
  currentMonth=e.target.value;
  if(e.target.value) document.getElementById('range-month-select').value='';
  render();
});
document.getElementById('toggle-subcat').addEventListener('change',function(){if(currentTab==='category')render();});
document.getElementById('source-tabs').addEventListener('click',function(e){
  const btn=e.target.closest('.source-btn');if(!btn)return;
  currentSource=btn.dataset.source;
  document.querySelectorAll('.source-btn').forEach(b=>b.classList.toggle('active',b===btn));
  render();
});
function updateRatioApp(){
  currentRatioNum=parseFloat(document.getElementById('ratio-num-app').value)||6;
  currentRatioDen=parseFloat(document.getElementById('ratio-den-app').value)||16;
  document.getElementById('ratio-pct-app').textContent=(currentRatioNum/currentRatioDen*100).toFixed(1)+'%';
  render();
}
document.getElementById('ratio-num-app').addEventListener('input',updateRatioApp);
document.getElementById('ratio-den-app').addEventListener('input',updateRatioApp);
function updateRangeFilter(){
  const base=document.getElementById('range-month-select').value;
  const n=parseInt(document.getElementById('range-n-select').value);
  if(!base||!n) return;
  currentMonth=base+'_range_'+n;
  document.getElementById('month-select').value='';
  render();
}
document.getElementById('range-month-select').addEventListener('change',updateRangeFilter);
document.getElementById('range-n-select').addEventListener('change',updateRangeFilter);

// 起動時
const stored=sessionStorage.getItem('gdrive_token');
if(stored){accessToken=stored;showMainApp();loadFromDrive();}
else showLoginScreen();
</script>

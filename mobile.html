<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="家計簿">
<title>家計簿</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif;font-size:13px;color:#1a1a1a;background:#f5f5f5;min-height:100vh}
body.modal-active{overflow:hidden}
.app{max-width:600px;margin:0 auto;padding:12px}
h1{font-size:19px;font-weight:700;margin-bottom:2px}
.subtitle{font-size:11px;color:#888;margin-bottom:12px}
.card{background:#fff;border-radius:12px;border:1px solid #eee;padding:14px;margin-bottom:10px}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.metric{background:#f8f8f8;border-radius:8px;padding:8px 6px;text-align:center}
.metric-label{font-size:10px;color:#888;margin-bottom:2px}
.metric-val{font-size:15px;font-weight:700}
.income-c{color:#166534}.expense-c{color:#991b1b}
.balance-pos{color:#166534}.balance-neg{color:#991b1b}
.amt-income{color:#166534}.amt-expense{color:#991b1b}
.balance-bar-wrap{margin-bottom:12px;padding:10px 12px;background:#f8f8f8;border-radius:10px}
.balance-bar-row{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.balance-bar-row:last-child{margin-bottom:0}
.balance-bar-label{font-size:11px;color:#888;width:28px;flex-shrink:0}
.balance-bar-track{flex:1;height:14px;background:#e8e8e8;border-radius:3px;overflow:hidden}
.balance-bar-fill{height:100%;border-radius:3px;transition:width .4s}
.income-bar{background:#1D9E75}.expense-bar{background:#D85A30}
.balance-bar-val{font-size:11px;font-weight:700;width:72px;text-align:right;flex-shrink:0}
.tabs{display:flex;gap:3px;padding:3px;background:#f3f3f3;border-radius:8px;margin-bottom:12px}
.tab{flex:1;padding:7px 4px;border-radius:6px;font-size:12px;cursor:pointer;border:none;background:transparent;color:#666;text-align:center}
.tab.active{background:#fff;color:#1a1a1a;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.controls{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap;align-items:center}
select{padding:5px 7px;border-radius:7px;border:1px solid #ddd;font-size:12px;background:#fff}
.source-tabs{display:flex;gap:3px}
.source-btn{padding:5px 9px;border-radius:6px;font-size:11px;cursor:pointer;border:1.5px solid #ddd;background:#fafafa;color:#666}
.source-btn.active{border-color:#2563eb;background:#eff6ff;color:#1d4ed8;font-weight:600}
.subcat-toggle-label{font-size:11px;color:#666;display:flex;align-items:center;gap:3px;cursor:pointer}
.ratio-label{font-size:11px;color:#666;display:flex;align-items:center;gap:3px}
.ratio-input{width:34px;padding:3px 4px;border:1px solid #ddd;border-radius:5px;font-size:11px;text-align:center}
.ratio-pct{font-size:11px;font-weight:600;color:#2563eb;min-width:34px}
.range-label{font-size:11px;color:#666}
.range-select{padding:4px 6px;border-radius:6px;border:1px solid #ddd;font-size:11px;background:#fff}
.controls-range{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-bottom:8px}
table{width:100%;border-collapse:collapse;font-size:12px}
thead th{text-align:left;padding:6px 8px;color:#888;font-weight:600;border-bottom:1px solid #eee;font-size:11px}
tbody td{padding:7px 8px;border-bottom:1px solid #f5f5f5}
.amount-cell{text-align:right;font-weight:600}
.tag{display:inline-block;font-size:10px;padding:1px 5px;border-radius:4px}
.tag-personal{background:#eff6ff;color:#1d4ed8}.tag-family{background:#fef9c3;color:#854d0e}
.empty{text-align:center;padding:24px;color:#aaa;font-size:12px}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;font-size:11px;color:#666}
.leg-item{display:flex;align-items:center;gap:4px}
.leg-swatch{width:8px;height:8px;border-radius:2px;flex-shrink:0;display:inline-block}
.swatch-inline{margin-right:4px;vertical-align:middle;width:8px;height:8px;border-radius:2px;display:inline-block}
.bar-row{display:flex;align-items:center;gap:6px;margin-bottom:7px;cursor:pointer}
.bar-row:hover{opacity:0.8}
.bar-label{font-size:11px;color:#555;width:100px;text-align:right;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-bg{flex:1;height:15px;background:#f0f0f0;border-radius:3px;overflow:hidden}
.bar-fill{height:100%;border-radius:3px}
.bar-val{font-size:11px;color:#333;width:68px;flex-shrink:0;font-weight:600;text-align:right}
.section-header{font-size:10px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:.04em;margin:14px 0 8px;padding-top:12px;border-top:1px solid #f0f0f0}
.pct-cell{color:#888}
.list-date{white-space:nowrap;color:#888;font-size:11px}
.list-cat{color:#888;font-size:11px}
.view-hidden{display:none}
.trend-svg-wrap{width:100%;overflow:hidden;position:relative}
.trend-controls{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;align-items:center}
.trend-ctrl-group{display:flex;align-items:center;gap:3px}
.trend-ctrl-label{font-size:10px;color:#666}
.trend-sel{padding:3px 6px;border-radius:5px;border:1px solid #ddd;font-size:11px;background:#fff;cursor:pointer}
.trend-avg-hint{font-size:9px;color:#aaa}
.trend-cb-wrap{margin:8px 0;display:flex;flex-wrap:wrap;gap:4px;padding:6px;background:#f8f8f8;border-radius:6px;border:1px solid #eee}
.trend-cb-btn-row{width:100%;display:flex;gap:4px;margin-bottom:3px}
.trend-cat-all-btn{font-size:10px;padding:3px 7px;border-radius:4px;border:1px solid #ddd;background:#fff;cursor:pointer;color:#555}
.trend-cb-label{display:flex;align-items:center;gap:3px;font-size:11px;cursor:pointer;background:#fff;padding:2px 6px;border-radius:4px;border:1px solid #e0e0e0;user-select:none}
.trend-cb-label input{cursor:pointer;margin:0}
.trend-cb-sw{width:7px;height:7px;border-radius:2px;flex-shrink:0;pointer-events:none}
.trend-svg-el{width:100%;height:auto;display:block}
.trend-tooltip{position:absolute;pointer-events:none;background:rgba(20,20,20,0.92);color:#fff;padding:5px 8px;border-radius:5px;font-size:11px;line-height:1.4;display:none;z-index:10;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,0.2);transform:translate(-50%,calc(-100% - 6px))}
.trend-summary{width:100%;border-collapse:collapse;font-size:11px;margin-top:12px}
.trend-summary thead tr{background:#f8f8f8;font-size:10px;color:#888}
.trend-summary th{padding:5px 8px;font-weight:600}
.trend-summary td{padding:5px 8px;border-bottom:1px solid #f5f5f5}
.trend-summary-sw{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:4px;vertical-align:middle}
/* モーダル - スマホ用シートスタイル */
.modal-overlay{position:fixed;inset:0;z-index:1000;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,0.45)}
.modal-overlay.modal-open{display:flex}
.modal-box{background:#fff;border-radius:16px 16px 0 0;width:100%;max-height:88vh;display:flex;flex-direction:column;overflow:hidden}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid #f0f0f0}
.modal-title{margin:0;font-size:14px;font-weight:700}
.modal-close{border:none;background:none;font-size:22px;cursor:pointer;color:#888;padding:2px 6px}
.modal-body{overflow-y:auto;padding:0 0 24px;-webkit-overflow-scrolling:touch}
.modal-table{width:100%;border-collapse:collapse;font-size:12px}
.modal-thead-row{background:#f8f8f8;color:#888;font-size:10px}
.modal-th{font-weight:600;padding:6px 8px;text-align:left}
.modal-tr{border-bottom:1px solid #f3f3f3}
.modal-tr-even{background:#fff}.modal-tr-odd{background:#fafafa}
.modal-td-date{padding:9px 8px;white-space:nowrap;color:#888;font-size:11px}
.modal-td-name{padding:9px 6px;color:#1a1a1a;word-break:break-all;max-width:140px}
.modal-name-text{font-weight:500;font-size:12px}
.modal-subcat{display:inline-block;font-size:9px;background:#f0f0f0;color:#666;border-radius:3px;padding:1px 4px;margin-left:4px}
.modal-bar-bg{height:3px;background:#f0f0f0;border-radius:2px;margin-top:3px}
.modal-bar-fill{height:3px;background:#D85A30;border-radius:2px}
.modal-bar-row{display:flex;align-items:center;gap:4px;margin-top:3px}
.modal-bar-pct{font-size:9px;color:#aaa;white-space:nowrap}
.modal-td-amt{padding:9px 8px;text-align:right;font-weight:700;color:#991b1b;white-space:nowrap;font-size:12px}
.modal-td-src{padding:9px 6px}
.modal-tag-family{font-size:9px;background:#ede9fe;color:#6d28d9;border-radius:4px;padding:1px 4px}
.modal-tag-personal{font-size:9px;background:#dcfce7;color:#166534;border-radius:4px;padding:1px 4px}
.modal-td-edit{padding:6px 6px;white-space:nowrap}
.modal-excl-btn{font-size:9px;border:1px solid #ddd;background:#f8f8f8;color:#888;border-radius:4px;padding:2px 5px;cursor:pointer;margin-right:3px}
.modal-excl-active{background:#fef2f2;color:#991b1b;border-color:#fecaca}
.modal-edit-btn{font-size:11px;border:none;background:none;cursor:pointer;padding:2px 3px;border-radius:4px}
.inline-edit-row{background:#fffbeb}
.inline-edit-cell{padding:8px 10px;border-bottom:1px solid #f3f3f3;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px}
.edit-select{font-size:12px;padding:4px 6px;border:1px solid #ddd;border-radius:6px}
.edit-input{font-size:12px;padding:4px 6px;border:1px solid #ddd;border-radius:6px;width:110px}
.edit-save-btn{font-size:12px;background:#2563eb;color:#fff;border:none;border-radius:6px;padding:5px 10px;cursor:pointer}
.edit-cancel-btn{font-size:12px;background:#f0f0f0;color:#666;border:none;border-radius:6px;padding:5px 10px;cursor:pointer}
/* ログイン画面 */
.login-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:90vh;gap:18px;text-align:center;padding:24px}
.login-title{font-size:22px;font-weight:700}
.login-desc{font-size:13px;color:#666;line-height:1.6}
.google-btn{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid #ddd;border-radius:10px;padding:12px 22px;font-size:14px;font-weight:600;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.status-bar{padding:8px 12px;border-radius:8px;font-size:12px;margin-bottom:10px;display:none}
.status-bar.ok{background:#f0fdf4;color:#166534;border:1px solid #bbf7d0;display:block}
.status-bar.err{background:#fef2f2;color:#991b1b;border:1px solid #fecaca;display:block}
.status-bar.loading{background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe;display:block}
.header-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.refresh-btn{font-size:12px;color:#2563eb;background:none;border:none;cursor:pointer;padding:0}
/* 資産シミュレーター（モバイル） */
.sim-wrap{padding:2px 0}
.sim-inputs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.sim-input-group{display:flex;flex-direction:column;gap:3px}
.sim-label{font-size:10px;color:#666;font-weight:500;line-height:1.3}
.sim-input{padding:6px 8px;border:1px solid #ddd;border-radius:7px;font-size:13px;width:100%}
.sim-input:focus{outline:none;border-color:#2563eb}
.sim-section-title{font-size:12px;font-weight:700;color:#1a1a1a;margin:14px 0 8px;padding-bottom:5px;border-bottom:2px solid #f0f0f0}
.sim-btn{padding:7px 14px;background:#2563eb;color:#fff;border:none;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;margin-top:4px}
.sim-result-cards{display:grid;grid-template-columns:1fr;gap:8px;margin-bottom:14px}
.sim-card{background:#f8f8f8;border-radius:10px;padding:10px 12px;text-align:center}
.sim-card-label{font-size:10px;color:#888;margin-bottom:3px}
.sim-card-val{font-size:17px;font-weight:700}
.sim-card-sub{font-size:10px;color:#888;margin-top:2px}
.sim-chart-wrap{width:100%;overflow-x:auto;margin-bottom:14px;-webkit-overflow-scrolling:touch}
.sim-table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.sim-table{width:100%;border-collapse:collapse;font-size:10px}
.sim-table th{padding:4px 5px;background:#f8f8f8;color:#888;font-weight:600;text-align:right;border-bottom:1px solid #eee;white-space:nowrap}
.sim-table th:first-child{text-align:left}
.sim-table td{padding:4px 5px;border-bottom:1px solid #f5f5f5;text-align:right;white-space:nowrap}
.sim-table td:first-child{text-align:left;font-weight:500}
.sim-table tr.sim-highlight{background:#eff6ff;font-weight:700}
.sim-table tr.sim-drawdown{background:#fef9c3}
.sim-badge-retire{display:inline-block;background:#2563eb;color:#fff;font-size:9px;padding:1px 5px;border-radius:4px;margin-left:4px;vertical-align:middle}
.sim-badge-draw{display:inline-block;background:#d97706;color:#fff;font-size:9px;padding:1px 5px;border-radius:4px;margin-left:4px;vertical-align:middle}
</style>
</head>
<body>

<div id="login-screen" class="login-screen">
  <div style="font-size:44px">📒</div>
  <div class="login-title">家計簿</div>
  <div class="login-desc">Google Driveに保存したデータを<br>読み込んで表示します</div>
  <button class="google-btn" id="google-login-btn">
    <svg width="20" height="20" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
    Googleでログイン
  </button>
  <div id="login-status" class="status-bar"></div>
</div>

<div id="main-app" class="app" style="display:none">
  <div class="header-row">
    <div><h1>家計簿</h1><p class="subtitle" id="subtitle">読み込み中...</p></div>
    <button class="refresh-btn" id="refresh-btn">🔄 更新</button>
  </div>
  <div id="status-bar" class="status-bar"></div>

  <div class="card">
    <div class="controls">
      <select id="month-select" style="flex:1"><option value="all">すべての期間</option></select>
    </div>
    <div class="controls-range">
      <span class="range-label">期間:</span>
      <select id="range-month-select" class="range-select"><option value="">月を選択</option></select>
      <span class="range-label">から</span>
      <select id="range-n-select" class="range-select">
        <option value="1">1ヶ月</option><option value="2">2ヶ月</option><option value="3">3ヶ月</option>
        <option value="4">4ヶ月</option><option value="5">5ヶ月</option><option value="6">6ヶ月</option>
        <option value="7">7ヶ月</option><option value="8">8ヶ月</option><option value="9">9ヶ月</option>
        <option value="10">10ヶ月</option><option value="11">11ヶ月</option><option value="12">12ヶ月</option>
      </select>
      <span class="range-label">分</span>
    </div>
    <div class="controls" style="margin-bottom:6px;gap:6px;flex-wrap:wrap">
      <div class="source-tabs" id="source-tabs">
        <button class="source-btn active" data-source="all">合算</button>
        <button class="source-btn" data-source="personal">個人</button>
        <button class="source-btn" data-source="family">家族</button>
      </div>
      <label class="subcat-toggle-label"><input type="checkbox" id="toggle-subcat"> 中項目</label>
    </div>
    <div class="controls" style="margin-bottom:10px">
      <label class="ratio-label">家族按分:
        <input type="number" id="ratio-num-app" min="1" max="99" value="6" class="ratio-input">
        /
        <input type="number" id="ratio-den-app" min="1" max="99" value="16" class="ratio-input">
        <span class="ratio-pct" id="ratio-pct-app">37.5%</span>
      </label>
    </div>

    <div class="tabs">
      <button class="tab active" id="tab-category">カテゴリ</button>
      <button class="tab" id="tab-trend">推移</button>
      <button class="tab" id="tab-list">明細</button>
      <button class="tab" id="tab-sim">資産シミュ</button>
    </div>

    <div class="balance-bar-wrap">
      <div class="balance-bar-row">
        <div class="balance-bar-label">収入</div>
        <div class="balance-bar-track"><div class="balance-bar-fill income-bar" id="bar-income"></div></div>
        <div class="balance-bar-val income-c" id="bar-income-val"></div>
      </div>
      <div class="balance-bar-row">
        <div class="balance-bar-label">支出</div>
        <div class="balance-bar-track"><div class="balance-bar-fill expense-bar" id="bar-expense"></div></div>
        <div class="balance-bar-val expense-c" id="bar-expense-val"></div>
      </div>
    </div>
    <div class="metrics">
      <div class="metric"><div class="metric-label">収入</div><div class="metric-val income-c" id="m-income">¥0</div></div>
      <div class="metric"><div class="metric-label">支出</div><div class="metric-val expense-c" id="m-expense">¥0</div></div>
      <div class="metric"><div class="metric-label">収支</div><div class="metric-val" id="m-balance">¥0</div></div>
    </div>

    <div id="view-category">
      <div id="cat-bars" style="margin-bottom:10px"></div>
      <table>
        <thead><tr><th>カテゴリ</th><th style="text-align:right">金額</th><th style="text-align:right">割合</th></tr></thead>
        <tbody id="cat-tbody"></tbody>
      </table>
    </div>
    <div id="view-trend" class="view-hidden"><div id="trend-chart" class="trend-svg-wrap"></div></div>
    <div id="view-list" class="view-hidden">
      <table>
        <thead><tr><th>日付</th><th>内容</th><th>カテゴリ</th><th>種別</th><th style="text-align:right">金額</th></tr></thead>
        <tbody id="list-tbody"></tbody>
      </table>
    </div>
    <div id="view-sim" class="view-hidden"><div id="sim-content"></div></div>
  </div>
</div>

<script>
const CLIENT_ID='293451920862-fjot50d3g4iac2afqq0eu39ssfggik6a.apps.googleusercontent.com';
const SCOPES='https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/drive.appdata';
const DRIVE_FILE_NAME='kakeibo_data.json';
const CAT_COLORS=['#3266ad','#0F6E56','#D85A30','#993556','#885FA5','#BA7517','#639922','#888780','#3C3489','#1D9E75'];

let allData=[],currentTab='category',currentMonth='all',currentSource='all';
let currentRatioNum=6,currentRatioDen=16,accessToken=null;

function fmt(n){return(n<0?'-':'')+'¥'+Math.abs(Math.round(n)).toLocaleString('ja-JP');}
function fmtM(n,maxVal){
  const m=Math.abs(maxVal!=null?maxVal:n);
  if(m>=100000) return '¥'+Math.round(n/10000).toLocaleString('ja-JP')+'万';
  if(m>=10000) return '¥'+(n/10000).toFixed(1)+'万';
  return '¥'+Math.round(n).toLocaleString('ja-JP');
}
function fmtMan(n){
  if(Math.abs(n)>=100000000) return (n/100000000).toFixed(2)+'億円';
  if(Math.abs(n)>=10000) return Math.round(n/10000).toLocaleString('ja-JP')+'万円';
  return n.toLocaleString('ja-JP')+'円';
}
function mkTd(text,color){
  const td=document.createElement('td');td.textContent=text;
  if(color) td.style.color=color;return td;
}
function getPeriodMonths(){
  if(currentMonth==='all') return [...new Set(allData.map(r=>r.month))].length||1;
  if(currentMonth.includes('_range_')) return parseInt(currentMonth.split('_range_')[1])||1;
  return 1;
}

// ===== Google Drive =====
function googleLogin(){
  const st=document.getElementById('login-status');
  st.className='status-bar loading';st.textContent='Googleにログイン中...';
  if(typeof google==='undefined'||!google.accounts){
    st.className='status-bar err';st.textContent='Googleライブラリ読み込み中。少し待ってから再試行してください。';return;
  }
  google.accounts.oauth2.initTokenClient({
    client_id:CLIENT_ID,scope:SCOPES,
    callback:function(res){
      if(res.error){st.className='status-bar err';st.textContent='エラー: '+res.error;return;}
      accessToken=res.access_token;
      sessionStorage.setItem('gdrive_token',accessToken);
      showMainApp();loadFromDrive();
    }
  }).requestAccessToken({prompt:'consent'});
}

async function loadFromDrive(){
  showStatus('loading','☁️ Google Driveからデータを読み込み中...');
  try{
    const res=await fetch(`https://www.googleapis.com/drive/v3/files?q=name='${DRIVE_FILE_NAME}' and trashed=false&fields=files(id,name)`,
      {headers:{Authorization:`Bearer ${accessToken}`}});
    if(res.status===401){sessionStorage.removeItem('gdrive_token');accessToken=null;showLoginScreen();return;}
    const data=await res.json();
    if(!data.files||!data.files.length){showStatus('err','Driveにデータがありません。PC版で保存してください。');return;}
    const fileRes=await fetch(`https://www.googleapis.com/drive/v3/files/${data.files[0].id}?alt=media`,
      {headers:{Authorization:`Bearer ${accessToken}`}});
    const json=await fileRes.json();
    if(!Array.isArray(json)){showStatus('err','データ形式エラー');return;}
    allData=json.map(r=>Object.assign({},r,{month:(r.date||'').slice(0,7),
      effectiveAmount:r.effectiveAmount!==undefined?r.effectiveAmount:(r.isIncome?r.amount:Math.round(r.amount*(r.ratio||1)))})).filter(r=>r.month);
    initApp();
    showStatus('ok','✓ '+allData.length+'件読み込みました');
    setTimeout(()=>{document.getElementById('status-bar').style.display='none';},3000);
  }catch(e){showStatus('err','読み込みエラー: '+e.message);}
}

async function saveToDrive(){
  if(!accessToken){showStatus('err','先にGoogleにログインしてください');return;}
  showStatus('loading','☁️ 保存中...');
  try{
    const res=await fetch(`https://www.googleapis.com/drive/v3/files?q=name='${DRIVE_FILE_NAME}' and trashed=false&fields=files(id)`,
      {headers:{Authorization:`Bearer ${accessToken}`}});
    const data=await res.json();
    const json=JSON.stringify(allData);
    const blob=new Blob([json],{type:'application/json'});
    const form=new FormData();
    form.append('metadata',new Blob([JSON.stringify({name:DRIVE_FILE_NAME})],{type:'application/json'}));
    form.append('file',blob);
    const fileId=data.files&&data.files.length?data.files[0].id:null;
    const url=fileId?`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=multipart`
      :'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart';
    const method=fileId?'PATCH':'POST';
    await fetch(url,{method,headers:{Authorization:`Bearer ${accessToken}`},body:form});
    showStatus('ok','✓ Driveに保存しました');
    setTimeout(()=>{document.getElementById('status-bar').style.display='none';},3000);
  }catch(e){showStatus('err','保存エラー: '+e.message);}
}

function showStatus(type,msg){const el=document.getElementById('status-bar');if(!el)return;el.className='status-bar '+type;el.textContent=msg;}

// ===== データ処理 =====
function filteredData(){
  let rows;
  if(currentMonth==='all'){rows=allData;}
  else if(currentMonth.includes('_range_')){
    const parts=currentMonth.split('_range_');
    const base=parts[0];const n=parseInt(parts[1]);
    const [by,bm]=base.split('-').map(Number);const months=[];
    for(let i=0;i<n;i++){let y=by,m=bm-i;while(m<1){m+=12;y--;}months.push(y+'-'+String(m).padStart(2,'0'));}
    rows=allData.filter(r=>months.includes(r.month));
  } else {rows=allData.filter(r=>r.month===currentMonth);}
  rows=rows.filter(r=>r.excluded!==true);
  if(currentSource!=='all') rows=rows.filter(r=>r.source===currentSource);
  const ratio=currentRatioNum/currentRatioDen;
  rows=rows.map(r=>{
    if(r.source!=='family') return r;
    return Object.assign({},r,{ratio,effectiveAmount:r.isIncome?r.amount:Math.round(r.amount*ratio)});
  });
  return rows;
}

function render(){
  const rows=filteredData();
  const income=rows.filter(r=>r.isIncome).reduce((s,r)=>s+r.effectiveAmount,0);
  const expense=rows.filter(r=>!r.isIncome).reduce((s,r)=>s+r.effectiveAmount,0);
  const balance=income-expense;
  document.getElementById('m-income').textContent=fmt(income);
  document.getElementById('m-expense').textContent=fmt(expense);
  const bEl=document.getElementById('m-balance');
  bEl.textContent=fmt(balance);bEl.className='metric-val '+(balance>=0?'balance-pos':'balance-neg');
  const barMax=Math.max(income,expense,1);
  document.getElementById('bar-income').style.width=Math.round(income/barMax*100)+'%';
  document.getElementById('bar-expense').style.width=Math.round(expense/barMax*100)+'%';
  document.getElementById('bar-income-val').textContent=fmt(income);
  document.getElementById('bar-expense-val').textContent=fmt(expense);
  if(currentTab==='category') renderCategory(rows);
  else if(currentTab==='trend') renderTrend();
  else renderList(rows);
}

// ===== カテゴリ詳細モーダル =====
function showCatDetail(cat,isIncome,useSubcat){
  let baseRows;
  if(currentMonth==='all'){baseRows=allData;}
  else if(currentMonth.includes('_range_')){
    const parts=currentMonth.split('_range_');const base=parts[0];const n=parseInt(parts[1]);
    const [by,bm]=base.split('-').map(Number);const months=[];
    for(let i=0;i<n;i++){let y=by,m=bm-i;while(m<1){m+=12;y--;}months.push(y+'-'+String(m).padStart(2,'0'));}
    baseRows=allData.filter(r=>months.includes(r.month));
  } else {baseRows=allData.filter(r=>r.month===currentMonth);}
  if(currentSource!=='all') baseRows=baseRows.filter(r=>r.source===currentSource);
  const ratio=currentRatioNum/currentRatioDen;
  baseRows=baseRows.map(r=>{
    if(r.source!=='family') return r;
    return Object.assign({},r,{ratio,effectiveAmount:r.isIncome?r.amount:Math.round(r.amount*ratio)});
  });
  const rows=baseRows.filter(r=>{
    if(!!r.isIncome!==!!isIncome) return false;
    if(useSubcat&&cat.includes(' > ')){const p=cat.split(' > ');return r.cat===p[0]&&(r.subcat||'')===p[1];}
    return r.cat===cat;
  });
  const active=rows.filter(r=>r.excluded!==true).sort((a,b)=>b.effectiveAmount-a.effectiveAmount);
  const excl=rows.filter(r=>r.excluded===true).sort((a,b)=>b.effectiveAmount-a.effectiveAmount);
  const sorted=[...active,...excl];

  let modal=document.getElementById('cat-modal');
  if(!modal){
    modal=document.createElement('div');modal.id='cat-modal';modal.className='modal-overlay';
    const box=document.createElement('div');box.className='modal-box';
    const header=document.createElement('div');header.className='modal-header';
    const title=document.createElement('h3');title.id='cat-modal-title';title.className='modal-title';
    const closeBtn=document.createElement('button');closeBtn.className='modal-close';closeBtn.textContent='×';
    closeBtn.addEventListener('click',closeCatModal);
    header.appendChild(title);header.appendChild(closeBtn);
    const body=document.createElement('div');body.id='cat-modal-body';body.className='modal-body';
    box.appendChild(header);box.appendChild(body);modal.appendChild(box);
    document.body.appendChild(modal);
    modal.addEventListener('click',function(e){if(e.target===modal)closeCatModal();});
  }

  document.getElementById('cat-modal-title').textContent=cat+' の明細（高い順）';
  document.getElementById('cat-modal-title').style.color=isIncome?'#166534':'#991b1b';
  const body=document.getElementById('cat-modal-body');body.innerHTML='';

  if(!sorted.length){
    const d=document.createElement('div');d.className='modal-empty';d.textContent='データがありません';body.appendChild(d);
  } else {
    const total=sorted.reduce((s,r)=>s+r.effectiveAmount,0);
    const table=document.createElement('table');table.className='modal-table';
    const thead=document.createElement('thead');const htr=document.createElement('tr');htr.className='modal-thead-row';
    ['日付','内容','金額','口座',''].forEach(function(l,i){
      const th=document.createElement('th');th.className='modal-th';th.textContent=l;htr.appendChild(th);
    });
    thead.appendChild(htr);table.appendChild(thead);
    const tbody=document.createElement('tbody');
    sorted.forEach(function(r,idx){
      const barW=total?Math.round(r.effectiveAmount/total*100):0;
      const tr=document.createElement('tr');tr.className='modal-tr '+(idx%2===0?'modal-tr-even':'modal-tr-odd');
      const tdDate=document.createElement('td');tdDate.className='modal-td-date';tdDate.textContent=r.date;
      const tdName=document.createElement('td');tdName.className='modal-td-name';
      const nameDiv=document.createElement('div');nameDiv.className='modal-name-text';nameDiv.textContent=r.name;
      if(r.subcat){const sc=document.createElement('span');sc.className='modal-subcat';sc.textContent=r.subcat;nameDiv.appendChild(sc);}
      const barRow=document.createElement('div');barRow.className='modal-bar-row';
      const barBg=document.createElement('div');barBg.className='modal-bar-bg';
      const barFill=document.createElement('div');barFill.className='modal-bar-fill';barFill.style.width=barW+'%';
      barBg.appendChild(barFill);
      const pctSp=document.createElement('span');pctSp.className='modal-bar-pct';pctSp.textContent=barW+'%';
      barRow.appendChild(barBg);barRow.appendChild(pctSp);
      tdName.appendChild(nameDiv);tdName.appendChild(barRow);
      const tdAmt=document.createElement('td');tdAmt.className='modal-td-amt';tdAmt.textContent=fmt(r.effectiveAmount);
      const tdSrc=document.createElement('td');tdSrc.className='modal-td-src';
      const tag=document.createElement('span');tag.className=r.source==='family'?'modal-tag-family':'modal-tag-personal';
      tag.textContent=r.source==='family'?'家族':'個人';tdSrc.appendChild(tag);
      const tdEdit=document.createElement('td');tdEdit.className='modal-td-edit';
      const exclBtn=document.createElement('button');
      exclBtn.className='modal-excl-btn'+(r.excluded===true?' modal-excl-active':'');
      exclBtn.textContent=r.excluded===true?'除外中':'除外';
      exclBtn.addEventListener('click',(function(row,btn,trEl){return function(){
        const nv=row.excluded!==true;
        updateEntry(row,{excluded:nv});row.excluded=nv;
        btn.className='modal-excl-btn'+(nv?' modal-excl-active':'');
        btn.textContent=nv?'除外中':'除外';trEl.style.opacity=nv?'0.4':'1';render();
      };})(r,exclBtn,tr));
      const editBtn=document.createElement('button');editBtn.className='modal-edit-btn';editBtn.textContent='✏️';
      editBtn.addEventListener('click',(function(row,trEl,btn){return function(){showEditForm(row,trEl,btn);};})(r,tr,editBtn));
      tdEdit.appendChild(exclBtn);tdEdit.appendChild(editBtn);
      tr.appendChild(tdDate);tr.appendChild(tdName);tr.appendChild(tdAmt);tr.appendChild(tdSrc);tr.appendChild(tdEdit);
      if(r.excluded===true) tr.style.opacity='0.4';
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);body.appendChild(table);
  }
  modal.className='modal-overlay modal-open';document.body.classList.add('modal-active');
}

function closeCatModal(){
  const m=document.getElementById('cat-modal');if(m)m.className='modal-overlay';
  document.body.classList.remove('modal-active');
}

// ===== 編集・除外（Drive保存） =====
function getCatList(){
  const cats={};
  allData.filter(r=>!r.isIncome).forEach(r=>{if(!cats[r.cat])cats[r.cat]=new Set();if(r.subcat)cats[r.cat].add(r.subcat);});
  return cats;
}

function updateEntry(row,updates){
  // allDataを更新
  const idx=allData.findIndex(r=>r.date===row.date&&r.name===row.name&&r.amount===row.amount&&r.source===row.source);
  if(idx>=0) Object.assign(allData[idx],updates);
  // Driveに自動保存
  if(accessToken) saveToDrive();
}

function showEditForm(r,tr,btn){
  const next=tr.nextElementSibling;
  if(next&&next.classList.contains('inline-edit-row')){next.remove();btn.textContent='✏️';return;}
  const catList=getCatList();
  const editRow=document.createElement('tr');editRow.className='inline-edit-row';
  const editCell=document.createElement('td');editCell.colSpan=5;editCell.className='inline-edit-cell';

  const catSel=document.createElement('select');catSel.className='edit-select';
  const defaultCats=['交際費','食費','日用品','住宅','水道・光熱費','通信費','教養・教育','趣味・娯楽','交通費','医療・薬','衣服・美容','その他'];
  Object.keys(catList).forEach(c=>{if(!defaultCats.includes(c))defaultCats.push(c);});
  defaultCats.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;if(c===r.cat)o.selected=true;catSel.appendChild(o);});

  const subcatSel=document.createElement('select');subcatSel.className='edit-select';
  const newInput=document.createElement('input');newInput.className='edit-input';newInput.type='text';
  newInput.placeholder='新しい中項目';newInput.style.display='none';

  function buildSubcats(cat){
    subcatSel.innerHTML='';
    const blank=document.createElement('option');blank.value='';blank.textContent='（なし）';subcatSel.appendChild(blank);
    const subcats=catList[cat]?[...catList[cat]].sort():[];
    subcats.forEach(s=>{const o=document.createElement('option');o.value=s;o.textContent=s;subcatSel.appendChild(o);});
    const no=document.createElement('option');no.value='__new__';no.textContent='＋ 新しく入力…';subcatSel.appendChild(no);
    if(r.subcat&&subcats.includes(r.subcat)){subcatSel.value=r.subcat;newInput.style.display='none';}
    else if(r.subcat){subcatSel.value='__new__';newInput.style.display='inline';newInput.value=r.subcat;}
    else{subcatSel.value='';newInput.style.display='none';}
  }
  buildSubcats(r.cat);
  catSel.addEventListener('change',function(){buildSubcats(catSel.value);});
  subcatSel.addEventListener('change',function(){newInput.style.display=subcatSel.value==='__new__'?'inline':'none';if(subcatSel.value!=='__new__')newInput.value='';});

  const saveBtn=document.createElement('button');saveBtn.className='edit-save-btn';saveBtn.textContent='保存';
  saveBtn.addEventListener('click',function(){
    const newCat=catSel.value;
    const newSubcat=subcatSel.value==='__new__'?newInput.value.trim():(subcatSel.value||'');
    updateEntry(r,{cat:newCat,subcat:newSubcat});
    r.cat=newCat;r.subcat=newSubcat;editRow.remove();btn.textContent='✏️';render();
  });
  const cancelBtn=document.createElement('button');cancelBtn.className='edit-cancel-btn';cancelBtn.textContent='キャンセル';
  cancelBtn.addEventListener('click',function(){editRow.remove();btn.textContent='✏️';});

  editCell.appendChild(document.createTextNode('カテゴリ: '));editCell.appendChild(catSel);
  editCell.appendChild(document.createTextNode(' 中項目: '));editCell.appendChild(subcatSel);editCell.appendChild(newInput);
  editCell.appendChild(saveBtn);editCell.appendChild(cancelBtn);
  editRow.appendChild(editCell);tr.insertAdjacentElement('afterend',editRow);btn.textContent='✖️';
}

    if(o[0]==='6') opt.selected=true;
    avgSel.appendChild(opt);
  });
  const avgHint=document.createElement('span');avgHint.className='trend-avg-hint';avgHint.textContent='(最新月除く)';
  avgWrap.appendChild(avgLabel);avgWrap.appendChild(avgSel);avgWrap.appendChild(avgHint);

  ctrl.appendChild(modeWrap);ctrl.appendChild(grainWrap);ctrl.appendChild(avgWrap);
  container.appendChild(ctrl);

  const chartArea=document.createElement('div');chartArea.id='trend-chart-area';
  container.appendChild(chartArea);

  // ツールチップ要素
  const tooltip=document.createElement('div');tooltip.className='trend-tooltip';
  container.appendChild(tooltip);
  function attachTooltip(el,text){
    el.style.cursor='pointer';
    function show(e){
      tooltip.style.display='block';
      tooltip.innerHTML=text.replace(/\n/g,'<br>');
      const rect=container.getBoundingClientRect();
      const touch=(e.touches&&e.touches[0])||e;
      tooltip.style.left=(touch.clientX-rect.left)+'px';
      tooltip.style.top=(touch.clientY-rect.top)+'px';
    }
    el.addEventListener('mouseenter',show);
    el.addEventListener('mousemove',show);
    el.addEventListener('mouseleave',function(){tooltip.style.display='none';});
    el.addEventListener('touchstart',show,{passive:true});
  }

  function drawTrend(){
    const cbWrapExisting=chartArea.querySelector('.trend-cb-wrap');
    if(cbWrapExisting) cbWrapExisting.remove();
    chartArea.innerHTML='';
    if(cbWrapExisting) chartArea.appendChild(cbWrapExisting);
    const mode=modeSel.value;
    const grain=grainSel.value;
    grainWrap.style.display=mode==='total'?'none':'flex';

    const rows=getTrendRows();
    const months=[...new Set(allData.map(r=>r.month))].sort();
    if(!months.length){chartArea.textContent='データがありません';return;}

    // 平均値計算（最新月除く）
    const avgPeriod=avgSel.value;
    function avg(arr){
      if(avgPeriod==='0'||!arr||months.length<=1) return null;
      const eligible=arr.slice(0,-1);
      if(!eligible.length) return null;
      const slice=avgPeriod==='all'?eligible:eligible.slice(-parseInt(avgPeriod));
      if(!slice.length) return null;
      return Math.round(slice.reduce((s,v)=>s+v,0)/slice.length);
    }

    const svgNS='http://www.w3.org/2000/svg';
    const W=600,H=220,pL=56,pR=14,pT=14,pB=34;
    const cW=W-pL-pR,cH=H-pT-pB;
    const n=months.length||1;
    const gap=cW/n;

    if(mode==='total'){
      const bW=Math.min(22,gap*0.3);
      const iVals=months.map(m=>Math.round(rows.filter(r=>r.month===m&&r.isIncome).reduce((s,r)=>s+r.effectiveAmount,0)));
      const eVals=months.map(m=>Math.round(rows.filter(r=>r.month===m&&!r.isIncome).reduce((s,r)=>s+r.effectiveAmount,0)));
      const maxVal=Math.max(...iVals,...eVals,1);
      const svg=makeSvg(svgNS,W,H);
      drawGrid(svg,svgNS,maxVal,W,H,pL,pR,pT,pB,cW,cH);
      months.forEach(function(m,i){
        const x=pL+gap*i+gap/2;
        const iH=Math.max((iVals[i]/maxVal)*cH,0);
        const eH=Math.max((eVals[i]/maxVal)*cH,0);
        if(iH>0){const r=mkRect(svgNS,x-bW-2,pT+cH-iH,bW,iH,'#1D9E75');attachTooltip(r,m+'\n収入: '+fmt(iVals[i]));svg.appendChild(r);}
        if(eH>0){const r=mkRect(svgNS,x+2,pT+cH-eH,bW,eH,'#D85A30');attachTooltip(r,m+'\n支出: '+fmt(eVals[i]));svg.appendChild(r);}
        drawLabel(svg,svgNS,x,pT+cH+18,m.slice(5));
      });
      // 平均破線
      const avgI=avg(iVals);
      const avgE=avg(eVals);
      [{val:avgI,color:'#1D9E75'},{val:avgE,color:'#D85A30'}].forEach(function(a){
        if(a.val==null) return;
        const y=pT+cH-(a.val/maxVal)*cH;
        const line=document.createElementNS(svgNS,'line');
        line.setAttribute('x1',pL);line.setAttribute('y1',y);
        line.setAttribute('x2',W-pR);line.setAttribute('y2',y);
        line.setAttribute('stroke',a.color);line.setAttribute('stroke-width','1.5');
        line.setAttribute('stroke-dasharray','5 4');line.setAttribute('opacity','0.85');
        svg.appendChild(line);
      });
      chartArea.appendChild(svg);
      const legItems=[
        {c:'#1D9E75',l:'収入'+(avgI!=null?' (平均 '+fmt(avgI)+')':'')},
        {c:'#D85A30',l:'支出'+(avgE!=null?' (平均 '+fmt(avgE)+')':'')}
      ];
      drawLegend(chartArea,legItems);
    } else {
      // カテゴリ別折れ線
      const isIncome=mode==='cat_inc';
      const catRows=rows.filter(r=>!!r.isIncome===isIncome);
      const catKeys=new Set();
      catRows.forEach(r=>{const k=grain==='subcat'&&r.subcat?r.cat+' > '+r.subcat:r.cat;catKeys.add(k);});
      const cats=[...catKeys].sort();
      const colors=cats.map((_,i)=>CAT_COLORS[i%CAT_COLORS.length]);

      const catVals={};
      cats.forEach(function(c){
        catVals[c]=months.map(function(m){
          return Math.round(catRows.filter(r=>{
            const k=grain==='subcat'&&r.subcat?r.cat+' > '+r.subcat:r.cat;
            return r.month===m&&k===c;
          }).reduce((s,r)=>s+r.effectiveAmount,0));
        });
      });

      // チェックボックスエリア
      let cbWrap=chartArea.querySelector('.trend-cb-wrap');
      const prevCats=cbWrap?[...cbWrap.querySelectorAll('input')].map(i=>i.value).join(','):'';
      if(!cbWrap||prevCats!==cats.join(',')){
        if(cbWrap) cbWrap.remove();
        cbWrap=document.createElement('div');cbWrap.className='trend-cb-wrap';
        const btnRow=document.createElement('div');btnRow.className='trend-cb-btn-row';
        const allBtn=document.createElement('button');allBtn.textContent='全選択';allBtn.className='trend-cat-all-btn';
        const noneBtn=document.createElement('button');noneBtn.textContent='全解除';noneBtn.className='trend-cat-all-btn';
        allBtn.addEventListener('click',function(){cbWrap.querySelectorAll('input').forEach(cb=>cb.checked=true);drawChart();});
        noneBtn.addEventListener('click',function(){cbWrap.querySelectorAll('input').forEach(cb=>cb.checked=false);drawChart();});
        btnRow.appendChild(allBtn);btnRow.appendChild(noneBtn);cbWrap.appendChild(btnRow);
        cats.forEach(function(c,i){
          const label=document.createElement('label');label.className='trend-cb-label';
          const cb=document.createElement('input');cb.type='checkbox';cb.value=c;cb.checked=true;
          cb.addEventListener('change',drawChart);
          const sw=document.createElement('span');sw.className='trend-cb-sw';sw.style.background=colors[i];
          label.appendChild(cb);label.appendChild(sw);label.appendChild(document.createTextNode(c));
          cbWrap.appendChild(label);
        });
        chartArea.insertBefore(cbWrap,chartArea.firstChild);
      }

      function drawChart(){
        [...chartArea.children].forEach(function(el){if(!el.classList.contains('trend-cb-wrap'))el.remove();});
        const selectedCats=[...cbWrap.querySelectorAll('input:checked')].map(cb=>cb.value);
        if(!selectedCats.length) return;
        const maxVal=Math.max(...selectedCats.map(c=>catVals[c]||[0]).flat(),1);
        const svg=makeSvg(svgNS,W,H);
        drawGrid(svg,svgNS,maxVal,W,H,pL,pR,pT,pB,cW,cH);

        selectedCats.forEach(function(cat){
          const ci=cats.indexOf(cat);if(ci<0)return;
          const pts=months.map(function(m,i){
            const x=pL+gap*i+gap/2;
            const y=pT+cH-Math.max((catVals[cat][i]/maxVal)*cH,0);
            return x+','+y;
          });
          const polyline=document.createElementNS(svgNS,'polyline');
          polyline.setAttribute('points',pts.join(' '));
          polyline.setAttribute('fill','none');
          polyline.setAttribute('stroke',colors[ci]);
          polyline.setAttribute('stroke-width','2');
          polyline.setAttribute('stroke-linejoin','round');
          svg.appendChild(polyline);
          // 平均破線
          const aVal=avg(catVals[cat]);
          if(aVal!=null&&maxVal>0){
            const ay=pT+cH-(aVal/maxVal)*cH;
            const aline=document.createElementNS(svgNS,'line');
            aline.setAttribute('x1',pL);aline.setAttribute('y1',ay);
            aline.setAttribute('x2',W-pR);aline.setAttribute('y2',ay);
            aline.setAttribute('stroke',colors[ci]);
            aline.setAttribute('stroke-width','1');
            aline.setAttribute('stroke-dasharray','4 4');
            aline.setAttribute('opacity','0.55');
            svg.appendChild(aline);
          }
          months.forEach(function(m,i){
            const val=catVals[cat][i];
            if(val>0){
              const x=pL+gap*i+gap/2;
              const y=pT+cH-(val/maxVal)*cH;
              const circle=document.createElementNS(svgNS,'circle');
              circle.setAttribute('cx',x);circle.setAttribute('cy',y);circle.setAttribute('r','4');
              circle.setAttribute('fill',colors[ci]);
              attachTooltip(circle,cat+'\n'+m+': '+fmt(val));
              svg.appendChild(circle);
            }
          });
        });
        months.forEach(function(m,i){drawLabel(svg,svgNS,pL+gap*i+gap/2,pT+cH+18,m.slice(5));});
        chartArea.appendChild(svg);
        drawLegend(chartArea,selectedCats.map(function(c){return {c:colors[cats.indexOf(c)],l:c};}));

        // サマリーテーブル
        const totalBycat={};cats.forEach(c=>{totalBycat[c]=catVals[c].reduce((s,v)=>s+v,0);});
        const grandTotal=selectedCats.reduce((s,c)=>s+(totalBycat[c]||0),0);
        const showAvgCol=avgPeriod!=='0';
        const tbl=document.createElement('table');tbl.className='trend-summary';
        const thead=document.createElement('thead');const htr=document.createElement('tr');
        const headers=showAvgCol?['カテゴリ','合計','平均','割合']:['カテゴリ','合計','割合'];
        headers.forEach(function(l,i){
          const th=document.createElement('th');
          th.style.textAlign=i===0?'left':'right';
          th.textContent=l;htr.appendChild(th);
        });
        thead.appendChild(htr);tbl.appendChild(thead);
        const tbody=document.createElement('tbody');
        [...selectedCats].sort((a,b)=>(totalBycat[b]||0)-(totalBycat[a]||0)).forEach(function(c){
          const tr=document.createElement('tr');
          const pct=grandTotal?(totalBycat[c]/grandTotal*100).toFixed(1):0;
          const td1=document.createElement('td');
          const sw=document.createElement('span');sw.className='trend-summary-sw';sw.style.background=colors[cats.indexOf(c)];
          td1.appendChild(sw);td1.appendChild(document.createTextNode(c));
          const td2=document.createElement('td');td2.style.textAlign='right';td2.style.fontWeight='600';td2.textContent=fmt(totalBycat[c]||0);
          tr.appendChild(td1);tr.appendChild(td2);
          if(showAvgCol){
            const avgC=avg(catVals[c]);
            const tdA=document.createElement('td');tdA.style.textAlign='right';tdA.style.color='#444';
            tdA.textContent=avgC!=null?fmt(avgC):'-';
            tr.appendChild(tdA);
          }
          const td3=document.createElement('td');td3.style.textAlign='right';td3.style.color='#888';td3.textContent=pct+'%';
          tr.appendChild(td3);tbody.appendChild(tr);
        });
        tbl.appendChild(tbody);chartArea.appendChild(tbl);
      }
      drawChart();
    }
  }

  // ヘルパー
  function makeSvg(ns,W,H){
    const svg=document.createElementNS(ns,'svg');
    svg.setAttribute('viewBox','0 0 '+W+' '+H);
    svg.setAttribute('width',W);svg.setAttribute('height',H);
    svg.setAttribute('class','trend-svg-el');
    return svg;
  }
  function drawGrid(svg,ns,maxVal,W,H,pL,pR,pT,pB,cW,cH){
    [0,0.25,0.5,0.75,1].forEach(function(f){
      const y=pT+cH*(1-f);
      const line=document.createElementNS(ns,'line');
      line.setAttribute('x1',pL);line.setAttribute('y1',y);line.setAttribute('x2',W-pR);line.setAttribute('y2',y);
      line.setAttribute('stroke','#eee');line.setAttribute('stroke-width','1');svg.appendChild(line);
      if(f>0){
        const text=document.createElementNS(ns,'text');
        text.setAttribute('x',pL-5);text.setAttribute('y',y+3);
        text.setAttribute('text-anchor','end');text.setAttribute('font-size','10');text.setAttribute('fill','#aaa');
        text.textContent=fmtM(maxVal*f,maxVal);svg.appendChild(text);
      }
    });
  }
  function mkRect(ns,x,y,w,h,fill){
    const r=document.createElementNS(ns,'rect');
    r.setAttribute('x',x);r.setAttribute('y',y);r.setAttribute('width',w);r.setAttribute('height',h);
    r.setAttribute('fill',fill);r.setAttribute('rx','2');return r;
  }
  function drawLabel(svg,ns,x,y,text){
    const t=document.createElementNS(ns,'text');
    t.setAttribute('x',x);t.setAttribute('y',y);t.setAttribute('text-anchor','middle');
    t.setAttribute('font-size','10');t.setAttribute('fill','#888');t.textContent=text;svg.appendChild(t);
  }
  function drawLegend(container,items){
    const leg=document.createElement('div');leg.className='legend';leg.style.flexWrap='wrap';
    items.forEach(function(item){
      const sp=document.createElement('span');sp.className='leg-item';
      const sw=document.createElement('span');sw.className='leg-swatch';sw.style.background=item.c;
      sp.appendChild(sw);sp.appendChild(document.createTextNode(item.l));leg.appendChild(sp);
    });
    container.appendChild(leg);
  }

  modeSel.addEventListener('change',drawTrend);
  grainSel.addEventListener('change',drawTrend);
  avgSel.addEventListener('change',drawTrend);
  drawTrend();
}

function renderList(rows){
  const tbody=document.getElementById('list-tbody');tbody.innerHTML='';
  const sorted=[...rows].sort((a,b)=>b.date.localeCompare(a.date));
  if(!sorted.length){tbody.innerHTML='<tr><td colspan="5" class="empty">データがありません</td></tr>';return;}
  sorted.forEach(function(r){
    const tr=document.createElement('tr');
    const tdDate=document.createElement('td');tdDate.className='list-date';tdDate.textContent=r.date;
    const tdName=document.createElement('td');tdName.style.cssText='font-size:12px;max-width:100px;word-break:break-all';tdName.textContent=r.name.slice(0,18);
    const tdCat=document.createElement('td');tdCat.className='list-cat';tdCat.textContent=r.cat;
    const tdSrc=document.createElement('td');
    const tag=document.createElement('span');tag.className=r.source==='family'?'tag tag-family':'tag tag-personal';
    tag.textContent=r.source==='family'?'家':'個';tdSrc.appendChild(tag);
    const tdAmt=document.createElement('td');tdAmt.className='amount-cell '+(r.isIncome?'amt-income':'amt-expense');
    tdAmt.textContent=(r.isIncome?'+':'-')+fmt(r.effectiveAmount).replace(/^-/,'');
    tr.appendChild(tdDate);tr.appendChild(tdName);tr.appendChild(tdCat);tr.appendChild(tdSrc);tr.appendChild(tdAmt);
    tbody.appendChild(tr);
  });
}

function switchTab(tab){

// ===== 資産シミュレーション（PC版から移植） =====
function renderSim(){
  const container=document.getElementById('sim-content');
  if(container.querySelector('.sim-wrap')){
    // UIは既にあるのでイベントリストとシミュだけ更新
    renderEvents();
    runSim();
    return;
  }
  container.innerHTML='';
  const wrap=document.createElement('div');wrap.className='sim-wrap';

  const profTitle=document.createElement('div');profTitle.className='sim-section-title';profTitle.textContent='👤 プロファイル';
  wrap.appendChild(profTitle);
  const profBar=document.createElement('div');profBar.style.cssText='display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px';
  const profSel=document.createElement('select');profSel.id='sim-prof-sel';profSel.className='sim-input';profSel.style.cssText='flex:1;min-width:120px;max-width:200px';
  const profNameInp=document.createElement('input');profNameInp.type='text';profNameInp.id='sim-prof-name';profNameInp.className='sim-input';profNameInp.placeholder='プロファイル名';profNameInp.style.cssText='flex:1;min-width:120px;max-width:200px';
  const profSaveBtn=document.createElement('button');profSaveBtn.textContent='💾 保存';profSaveBtn.className='sim-btn';profSaveBtn.style.cssText='padding:7px 14px;font-size:12px';
  const profDelBtn=document.createElement('button');profDelBtn.textContent='🗑 削除';profDelBtn.className='sim-btn';profDelBtn.style.cssText='padding:7px 14px;font-size:12px;background:#ef4444';
  profBar.appendChild(profSel);profBar.appendChild(profNameInp);profBar.appendChild(profSaveBtn);profBar.appendChild(profDelBtn);
  wrap.appendChild(profBar);

  function loadProfiles(cb){try{cb(JSON.parse(localStorage.getItem('sim_profiles')||'{}'));}catch(e){cb({});}}
  function saveProfiles(profiles,cb){try{localStorage.setItem('sim_profiles',JSON.stringify(profiles));}catch(e){}if(cb)cb();}
  function getSimFields(){
    const fields=['sim-age','sim-retire','sim-cash','sim-invest','sim-monthly','sim-rate','sim-stop-age','sim-drawdown-age','sim-drawdown-rate'];
    const obj=fields.reduce(function(o,id){o[id]=document.getElementById(id).value;return o;},{});
    // ライフイベントも保存（idを除いて保存）
    obj._events=simEvents.map(function(ev){return Object.assign({},ev,{id:undefined});});
    // 月間収支UIの値も保存
    const mi=document.getElementById('sim-monthly-invest');
    if(mi) obj._monthlyInvest=mi.value;
    const mb=document.getElementById('sim-monthly-balance');
    if(mb) obj._monthlyBalance=mb.textContent;
    return obj;
  }
  function setSimFields(data){
    const fields=['sim-age','sim-retire','sim-cash','sim-invest','sim-monthly','sim-rate','sim-stop-age','sim-drawdown-age','sim-drawdown-rate'];
    fields.forEach(function(id){const el=document.getElementById(id);if(el&&data[id]!==undefined)el.value=data[id];});
    // ライフイベント復元
    if(data._events&&Array.isArray(data._events)){
      simEvents=data._events.map(function(ev){return Object.assign({},ev,{id:simEventId++});});
      renderEvents();
    }
    // 月間現金増加の値を復元
    if(data._monthlyInvest!==undefined){
      const mi=document.getElementById('sim-monthly-invest');
      if(mi){mi.value=data._monthlyInvest;updateCashCalc();}
    }
    runSim();
  }
  function refreshProfSel(profiles,selected){profSel.innerHTML='<option value="">── 選択 ──</option>';Object.keys(profiles).sort().forEach(function(name){const o=document.createElement('option');o.value=name;o.textContent=name;if(name===selected)o.selected=true;profSel.appendChild(o);});}
  loadProfiles(function(profiles){refreshProfSel(profiles,'');});
  // プロファイル切り替えは名前欄を更新するだけ（即座に反映しない）
  profSel.addEventListener('change',function(){const name=profSel.value;if(name)profNameInp.value=name;});
  // 読み込みボタン

  profSaveBtn.addEventListener('click',function(){const name=profNameInp.value.trim();if(!name){alert('プロファイル名を入力してください');return;}loadProfiles(function(profiles){profiles[name]=getSimFields();saveProfiles(profiles,function(){refreshProfSel(profiles,name);profSaveBtn.textContent='✓ 保存済';setTimeout(function(){profSaveBtn.textContent='💾 保存';},1500);});});});
  const profLoadBtn=document.createElement('button');profLoadBtn.textContent='📂 読み込み';profLoadBtn.className='sim-btn';profLoadBtn.style.cssText='padding:7px 14px;font-size:12px;background:#6366f1';
  profLoadBtn.addEventListener('click',function(){
    const name=profSel.value;
    if(!name){alert('読み込むプロファイルを選択してください');return;}
    loadProfiles(function(profiles){
      if(profiles[name]){
        profNameInp.value=name;
        simEvents=[];simEventId=0;
        setSimFields(profiles[name]);
        profLoadBtn.textContent='✓ 読み込み済';
        setTimeout(function(){profLoadBtn.textContent='📂 読み込み';},1500);
      }
    });
  });
  profBar.appendChild(profLoadBtn);
  profDelBtn.addEventListener('click',function(){const name=profSel.value;if(!name){alert('削除するプロファイルを選択してください');return;}if(!confirm(name+'を削除しますか？'))return;loadProfiles(function(profiles){delete profiles[name];saveProfiles(profiles,function(){refreshProfSel(profiles,'');profNameInp.value='';});});});

  // 家計簿連携セクション
  const linkTitle=document.createElement('div');linkTitle.className='sim-section-title';linkTitle.textContent='🔗 月間収支から現金増加を計算';
  wrap.appendChild(linkTitle);

  const linkCard=document.createElement('div');
  linkCard.style.cssText='background:#f8faff;border:1.5px solid #bfdbfe;border-radius:12px;padding:16px;margin-bottom:16px';

  // 取得ボタン行
  const linkTopRow=document.createElement('div');linkTopRow.style.cssText='display:flex;justify-content:space-between;align-items:center;margin-bottom:12px';
  const linkLabel=document.createElement('div');linkLabel.style.cssText='font-size:12px;color:#1d4ed8;font-weight:600';linkLabel.textContent='家計簿の月平均収支';
  const linkBtn=document.createElement('button');linkBtn.textContent='📊 家計簿から取得';linkBtn.className='sim-btn';linkBtn.style.cssText='padding:5px 12px;font-size:12px;background:#2563eb';
  linkTopRow.appendChild(linkLabel);linkTopRow.appendChild(linkBtn);
  linkCard.appendChild(linkTopRow);

  // 計算式表示エリア
  const calcRow=document.createElement('div');
  calcRow.style.cssText='display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px;background:#fff;border-radius:8px;border:1px solid #e0e7ff;font-size:13px';

  function makeCalcBox(id,label,color,editable,unit){
    const box=document.createElement('div');box.style.cssText='display:flex;flex-direction:column;align-items:center;gap:2px;min-width:90px';
    const lbl=document.createElement('div');lbl.style.cssText='font-size:10px;color:#888';lbl.textContent=label;
    if(editable){
      const inp=document.createElement('input');inp.type='number';inp.id=id;
      inp.style.cssText='width:90px;text-align:center;padding:5px;border:1.5px solid '+color+';border-radius:6px;font-size:14px;font-weight:700;color:'+color;
      inp.addEventListener('input',updateCashCalc);
      box.appendChild(lbl);box.appendChild(inp);
    } else {
      const val=document.createElement('div');val.id=id;
      val.style.cssText='font-size:14px;font-weight:700;color:'+color+';padding:5px 8px;background:#f8f8f8;border-radius:6px;min-width:90px;text-align:center';
      val.textContent='—';

    }
    if(unit){const u=document.createElement('div');u.style.cssText='font-size:10px;color:#aaa';u.textContent=unit;box.appendChild(u);}
    return box;

      const grp=childNum===1&&childNums.size===0?'👶 子供1':'👶 子供'+childNum;
      // 既存の「👶 子供」（番号なし）を「👶 子供1」にリネーム

        addEvent({label:'大学学費',group:grp,patternName:patLbl,startAge:us,endAge:Math.min(ue-1,95),monthly:c.uniM,oneTime:0,interval:0});

  presetBar.appendChild(customBtn);

  customIncBtn.addEventListener('click',function(){addEvent({label:'新しい収入',group:'💰 臨時収入',startAge:getSimVal('sim-age')||35,endAge:getSimVal('sim-age')||35,monthly:0,oneTime:0,interval:0,isIncome:true});renderEvents();runSim();});
  presetBar.appendChild(customIncBtn);
